TCP_PORT_LABEL=TCP Port
TCP_PORT_DESC=The TCP port the MCP endpoint listens on.
BIND_ADDR_LABEL=Bind Address
BIND_ADDR_DESC=The local address to bind the listener to (use 127.0.0.1 unless intentionally exposing this beyond localhost).
ENDPOINT_PATH_LABEL=Endpoint Path
ENDPOINT_PATH_DESC=The HTTP path the MCP endpoint is served on, e.g. /mcp.
TOOL_CATALOG_LABEL=Tool Catalog (JSON)
TOOL_CATALOG_DESC=A JSON array of MCP tool definitions (name, description, inputSchema) returned verbatim by tools/list.
AUTH_MODE_LABEL=Authentication Mode
AUTH_MODE_DESC=How clients authenticate to this endpoint: none, bearer token, or mutual TLS.
BEARER_TOKEN_LABEL=Bearer Token
BEARER_TOKEN_DESC=The token clients must present as "Authorization: Bearer <token>" when authMode is bearer.
GEN_TOKEN_BTN_LABEL=Generate Token
GEN_TOKEN_BTN_HELP=Generate a strong random bearer token, fill it into the Bearer Token field, copy it to the clipboard, and show it so you can paste it into your MCP client.
GEN_TOKEN_MSG=A new bearer token has been generated and filled into the Bearer Token field (stored encrypted when you save). Set Authentication Mode to "bearer" to enforce it, and send it from your MCP client as "Authorization: Bearer <token>". The value below is shown once and will be masked after you close this dialog.
GEN_TOKEN_COPIED=It has also been copied to your clipboard — just paste it into your client.
GEN_TOKEN_NOCOPY=(Automatic clipboard copy was unavailable; copy the value above manually.)
ALLOWED_ORIGINS_LABEL=Allowed Origins
ALLOWED_ORIGINS_DESC=Comma-separated list of allowed Origin header values (DNS-rebinding protection).
USE_SSL_LABEL=Use SSL
USE_SSL_DESC=Whether the listener requires TLS.
CLIENT_AUTH_LABEL=Require Client Certificate
CLIENT_AUTH_DESC=Whether mutual TLS client certificates are required (mtls auth mode).
HEALTH_PATH_LABEL=Health Check Path
HEALTH_PATH_DESC=Optional path that answers an unauthenticated GET with 200 OK for liveness checks (e.g. /health). Empty disables it.
MAX_REQ_BYTES_LABEL=Max Request Bytes
MAX_REQ_BYTES_DESC=Reject request bodies larger than this many bytes with 413. 0 (default) means no limit.
ACTOR_HEADER_LABEL=Trusted Actor Header
ACTOR_HEADER_DESC=Optional. Name of an HTTP header carrying the authenticated end-user identity, set by a trusted upstream proxy/gateway that terminates auth. Read into $mcp.actor when no mTLS client cert is present. Only set this if the upstream is trusted to set it; otherwise leave empty.
CONN_TITLE=MCP Server Connection
